<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Villeneuve - Software & Custom Tooling</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-main">
                <img src="MVLogoBlack.png" alt="Michel Villeneuve" class="header-logo">
                <div class="header-text">
                    <h1>Michel Villeneuve</h1>
                    <p>Mechanical designer & custom software tools</p>
                </div>
            </div>
        </div>
    </header>
    <!-- Filter Bar -->
    <nav class="filter-bar">
        <div class="filter-content">
            <span class="filter-label">Filter by:</span>
            <button class="filter-btn active" data-filter="all">All projects</button>
            <button class="filter-btn" data-filter="visual-studio">Visual Studio (C#/WPF)</button>
            <button class="filter-btn" data-filter="android">Android Studio</button>
        </div>
    </nav>

    <!-- Projects Grid -->
    <main class="projects-container">
        <div class="projects-grid" id="projectsGrid">
            <!-- Loaded dynamically via JavaScript -->
        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
